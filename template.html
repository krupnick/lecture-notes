<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lecture Title — Lecture Notes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>

  <h1>Lecture Title</h1>
  <p class="subtitle">Course name — date or week</p>

  <div class="prompt"><p>What you'll say aloud goes here.</p></div>
  <div class="note"><p>Your private annotation about that prompt goes here.</p></div>

  <div class="prompt"><p>Another prompt.</p></div>
  <div class="note">
    <p>A longer note can have multiple paragraphs.</p>
    <div class="argument">(1) First premise
(2) Second premise
So: (3) Conclusion [from (1),(2)]</div>
  </div>

</main>
</body>
</html>
