<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -92 600 326" width="600" height="326" role="img" aria-label="Parfit's My Division. At t1, me and my two brothers: my body is fatally injured (an X on my torso) and both brothers' brains are fatally injured (an X in each head). At t2, two healthy people: Lefty, with the left half of my brain in one brother's body, and Righty, with the right half in the other brother's body." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#241f1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#241f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="40" y1="150" x2="560" y2="150"/>
    <line x1="150" y1="140" x2="150" y2="160"/>
    <line x1="450" y1="140" x2="450" y2="160"/>
    <circle cx="90" cy="66" r="10"/><path d="M90 76 V106 M75 88 H105 M90 106 L78 126 M90 106 L102 126"/><circle cx="215" cy="66" r="10"/><path d="M215 76 V106 M200 88 H230 M215 106 L203 126 M215 106 L227 126"/><circle cx="215" cy="-29" r="10"/><path d="M215 -19 V11 M200 -7 H230 M215 11 L203 31 M215 11 L227 31"/><circle cx="450" cy="66" r="10"/><path d="M450 76 V106 M435 88 H465 M450 106 L438 126 M450 106 L462 126"/><circle cx="450" cy="-29" r="10"/><path d="M450 -19 V11 M435 -7 H465 M450 11 L438 31 M450 11 L462 31"/>
  </g>
  <!-- brains: whole = dot, halves = half-dots, injured = x -->
  <circle cx="90" cy="66" r="4.5" fill="#241f1c"/>
  <path d="M450 -33.5 A4.5 4.5 0 0 0 450 -24.5 Z" fill="#241f1c"/>
  <path d="M450 61.5 A4.5 4.5 0 0 1 450 70.5 Z" fill="#241f1c"/>
  <g stroke="#241f1c" stroke-width="2.2" stroke-linecap="round">
    <path d="M211 62 L219 70 M219 62 L211 70"/><path d="M211 -33 L219 -25 M219 -33 L211 -25"/>
    <path d="M79 92 L101 106 M101 92 L79 106"/>
  </g>
  <g fill="none" stroke="#241f1c" stroke-width="2" stroke-linecap="round">
    <path d="M88 50 Q150 -110 444 -43" marker-end="url(#arrow)"/>
    <path d="M96 52 Q270 28 436 60" marker-end="url(#arrow)"/>
    <path d="M237 2 H426" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <path d="M237 97 H426" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, 'Iowan Old Style', serif">
    <g font-size="14" font-style="italic" fill="#746b5e" text-anchor="middle">
      <text x="300" y="-71">left half of my brain</text>
      <text x="345" y="38">right half of my brain</text>
      <text x="344" y="-6">brother’s body</text>
      <text x="344" y="89">other brother’s body</text>
    </g>
    <g fill="#241f1c" font-size="16">
      <text x="70" y="124" text-anchor="end">me</text>
      <text x="470" y="29">Lefty</text>
      <text x="470" y="124">Righty</text>
    </g>
    <g fill="#241f1c" font-size="19" font-style="italic" text-anchor="middle">
      <text x="150" y="186">t<tspan font-size="13" dy="4">1</tspan></text>
      <text x="450" y="186">t<tspan font-size="13" dy="4">2</tspan></text>
    </g>
    <g fill="#746b5e" font-size="13" text-anchor="middle">
      <text x="150" y="210">my body and both my brothers’</text>
      <text x="150" y="227">brains fatally injured</text>
      <text x="450" y="210">each half of my brain in</text>
      <text x="450" y="227">a brother’s body</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
