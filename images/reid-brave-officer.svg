<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -78 600 298" width="600" height="298" role="img" aria-label="Reid's brave officer. A timeline with three stick figures: a boy flogged at school at t1, an officer taking the standard at t2, and a general at t3. Arrows show the officer remembers the flogging and the general remembers taking the standard, but a dashed arrow shows the general has no memory of the flogging." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#241f1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#241f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- timeline -->
    <line x1="40" y1="150" x2="560" y2="150"/>
    <line x1="100" y1="140" x2="100" y2="160"/>
    <line x1="300" y1="140" x2="300" y2="160"/>
    <line x1="500" y1="140" x2="500" y2="160"/>
    <!-- boy at t1 (a little smaller) -->
    <circle cx="100" cy="80" r="8"/>
    <path d="M100 88 V110 M88 97 H112 M100 110 L91 126 M100 110 L109 126"/>
    <!-- officer at t2 -->
    <circle cx="300" cy="66" r="10"/>
    <path d="M300 76 V106 M285 88 H315 M300 106 L288 126 M300 106 L312 126"/>
    <!-- general at t3 -->
    <circle cx="500" cy="66" r="10"/>
    <path d="M500 76 V106 M485 88 H515 M500 106 L488 126 M500 106 L512 126"/>
  </g>
  <!-- memory arrows (pointing back to what is remembered) -->
  <g fill="none" stroke="#241f1c" stroke-width="2" stroke-linecap="round">
    <path d="M296 48 Q200 14 104 64" marker-end="url(#arrow)"/>
    <path d="M496 48 Q400 18 304 48" marker-end="url(#arrow)"/>
    <path d="M502 44 Q300 -150 92 64" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, 'Iowan Old Style', serif">
    <rect x="250" y="-68" width="100" height="22" fill="#ffffff"/>
    <text x="300" y="-51" font-size="15" font-style="italic" text-anchor="middle" fill="#746b5e">no memory</text>
    <text x="200" y="24" font-size="14" font-style="italic" text-anchor="middle" fill="#746b5e">remembers</text>
    <text x="400" y="24" font-size="14" font-style="italic" text-anchor="middle" fill="#746b5e">remembers</text>
    <g fill="#241f1c" font-size="16">
      <text x="118" y="124">boy</text>
      <text x="320" y="124">officer</text>
      <text x="520" y="124">general</text>
    </g>
    <g fill="#241f1c" font-size="19" font-style="italic" text-anchor="middle">
      <text x="100" y="186">t<tspan font-size="13" dy="4">1</tspan></text>
      <text x="300" y="186">t<tspan font-size="13" dy="4">2</tspan></text>
      <text x="500" y="186">t<tspan font-size="13" dy="4">3</tspan></text>
    </g>
    <g fill="#746b5e" font-size="13" text-anchor="middle">
      <text x="100" y="210">flogged at school</text>
      <text x="300" y="210">takes the standard</text>
      <text x="500" y="210">made a general</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
