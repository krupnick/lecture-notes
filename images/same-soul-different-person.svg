<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 600 210" width="600" height="210" role="img" aria-label="A timeline. At t1 a stick figure A containing soul 1; at t2 a stick figure B containing that same soul 1. An arc joins them labelled A ≠ B: the same soul, but different people." xmlns:c2pa="http://c2pa.org/manifest">
  <g fill="none" stroke="#241f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- timeline -->
    <line x1="40" y1="150" x2="560" y2="150"/>
    <line x1="120" y1="140" x2="120" y2="160"/>
    <line x1="420" y1="140" x2="420" y2="160"/>
    <!-- A at t1 -->
    <circle cx="120" cy="66" r="10"/>
    <path d="M120 76 V106 M105 88 H135 M120 106 L108 126 M120 106 L132 126"/>
    <!-- B at t2 -->
    <circle cx="420" cy="66" r="10"/>
    <path d="M420 76 V106 M405 88 H435 M420 106 L408 126 M420 106 L432 126"/>
    <!-- identity arc -->
    <path d="M120 48 Q270 -2 420 48" stroke-dasharray="6 6"/>
  </g>
  <!-- the same soul (soul 1) in both -->
  <circle cx="120" cy="98" r="6" fill="#241f1c" stroke="#241f1c" stroke-width="2"/>
  <circle cx="420" cy="98" r="6" fill="#241f1c" stroke="#241f1c" stroke-width="2"/>
  <g stroke="#746b5e" stroke-width="1.5" stroke-linecap="round">
    <line x1="111" y1="98" x2="82" y2="98"/>
    <line x1="429" y1="98" x2="458" y2="98"/>
  </g>
  <g fill="#241f1c" font-family="Georgia, 'Iowan Old Style', serif">
    <rect x="236" y="4" width="68" height="24" fill="#ffffff"/>
    <text x="270" y="23" font-size="18" text-anchor="middle">A ≠ B</text>
    <text x="142" y="124" font-size="17">A</text>
    <text x="442" y="124" font-size="17">B</text>
    <text x="78" y="103" font-size="14" text-anchor="end" fill="#746b5e">soul 1</text>
    <text x="462" y="103" font-size="14" fill="#746b5e">soul 1</text>
    <text x="270" y="103" font-size="16" font-style="italic" text-anchor="middle" fill="#746b5e">same soul</text>
    <text x="120" y="186" font-size="19" font-style="italic" text-anchor="middle">t<tspan font-size="13" dy="4">1</tspan></text>
    <text x="420" y="186" font-size="19" font-style="italic" text-anchor="middle">t<tspan font-size="13" dy="4">2</tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
