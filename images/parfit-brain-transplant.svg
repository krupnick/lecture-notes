<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -28 600 262" width="600" height="262" role="img" aria-label="Parfit's brain transplant. At t1, me and my identical twin: my body is fatally injured (marked with an X on my torso) and my twin's brain is fatally injured (an X in his head). At t2, one healthy person: my brain, moved by the surgeons, inside my twin's body." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#241f1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#241f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- timeline -->
    <line x1="40" y1="150" x2="560" y2="150"/>
    <line x1="150" y1="140" x2="150" y2="160"/>
    <line x1="450" y1="140" x2="450" y2="160"/>
    <!-- me at t1 -->
    <circle cx="105" cy="66" r="10"/>
    <path d="M105 76 V106 M90 88 H120 M105 106 L93 126 M105 106 L117 126"/>
    <!-- my twin at t1 -->
    <circle cx="195" cy="66" r="10"/>
    <path d="M195 76 V106 M180 88 H210 M195 106 L183 126 M195 106 L207 126"/>
    <!-- resulting person at t2 -->
    <circle cx="450" cy="66" r="10"/>
    <path d="M450 76 V106 M435 88 H465 M450 106 L438 126 M450 106 L462 126"/>
  </g>
  <!-- brains: healthy = dot; injured = small x -->
  <circle cx="105" cy="66" r="4.5" fill="#241f1c"/>
  <circle cx="450" cy="66" r="4.5" fill="#241f1c"/>
  <g stroke="#241f1c" stroke-width="2.2" stroke-linecap="round">
    <path d="M191 62 L199 70 M199 62 L191 70"/>
    <!-- injured body: x on my torso -->
    <path d="M94 92 L116 106 M116 92 L94 106"/>
  </g>
  <!-- what goes where -->
  <g fill="none" stroke="#241f1c" stroke-width="2" stroke-linecap="round">
    <path d="M105 50 Q277 -60 446 54" marker-end="url(#arrow)"/>
    <path d="M216 97 Q330 82 428 97" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, 'Iowan Old Style', serif">
    <rect x="236" y="-16" width="84" height="22" fill="#ffffff"/>
    <text x="278" y="1" font-size="15" font-style="italic" text-anchor="middle" fill="#746b5e">my brain</text>
    <text x="322" y="80" font-size="15" font-style="italic" text-anchor="middle" fill="#746b5e">my twin’s body</text>
    <g fill="#241f1c" font-size="16">
      <text x="62" y="124">me</text>
      <text x="215" y="124">twin</text>
    </g>
    <g fill="#241f1c" font-size="19" font-style="italic" text-anchor="middle">
      <text x="150" y="186">t<tspan font-size="13" dy="4">1</tspan></text>
      <text x="450" y="186">t<tspan font-size="13" dy="4">2</tspan></text>
    </g>
    <g fill="#746b5e" font-size="13" text-anchor="middle">
      <text x="150" y="210">my body and my twin’s brain</text>
      <text x="150" y="227">fatally injured</text>
      <text x="450" y="210">my brain in my twin’s body:</text>
      <text x="450" y="227">healthy, no paralysis</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
