<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -22 600 252" width="600" height="252" role="img" aria-label="A timeline. At t1, at night, a tipsy stick figure holding a bottle gets drunk and commits crimes. At t2, the next morning, the same person wakes up. A dashed arrow from t2 back to t1 is labelled no memory." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#241f1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#241f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- timeline -->
    <line x1="40" y1="150" x2="560" y2="150"/>
    <line x1="150" y1="140" x2="150" y2="160"/>
    <line x1="450" y1="140" x2="450" y2="160"/>
    <!-- drunk at t1: tilted, holding a bottle -->
    <g transform="rotate(-12 150 126)">
      <circle cx="150" cy="66" r="10"/>
      <path d="M150 76 V106 M135 92 L150 86 L166 80 M150 106 L138 126 M150 106 L162 126"/>
      <path d="M167 79 V73 M163.5 73 H170.5" stroke-width="2"/>
      <rect x="163" y="80" width="8" height="15" rx="2" stroke-width="2"/>
    </g>
    <!-- moon -->
    <path d="M76 26 A14 14 0 1 0 90 46 A11 11 0 1 1 76 26 Z" stroke-width="2"/>
    <!-- next morning at t2 -->
    <circle cx="450" cy="66" r="10"/>
    <path d="M450 76 V106 M435 88 H465 M450 106 L438 126 M450 106 L462 126"/>
    <!-- sun -->
    <g stroke-width="2">
      <circle cx="530" cy="40" r="8"/>
      <path d="M530 24 V28 M530 52 V56 M514 40 H518 M542 40 H546 M519 29 L522 32 M538 48 L541 51 M519 51 L522 48 M538 32 L541 29"/>
    </g>
  </g>
  <!-- no memory of the night before -->
  <path d="M446 48 Q300 -26 142 52" fill="none" stroke="#241f1c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <g font-family="Georgia, 'Iowan Old Style', serif">
    <rect x="248" y="-8" width="104" height="22" fill="#ffffff"/>
    <text x="300" y="9" font-size="15" font-style="italic" text-anchor="middle" fill="#746b5e">no memory</text>
    <g fill="#241f1c" font-size="19" font-style="italic" text-anchor="middle">
      <text x="150" y="186">t<tspan font-size="13" dy="4">1</tspan></text>
      <text x="450" y="186">t<tspan font-size="13" dy="4">2</tspan></text>
    </g>
    <g fill="#746b5e" font-size="13" text-anchor="middle">
      <text x="150" y="210">gets drunk, commits crimes</text>
      <text x="450" y="210">wakes up the next morning</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
