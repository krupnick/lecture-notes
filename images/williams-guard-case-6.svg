<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -72 600 287" width="600" height="287" role="img" aria-label="Case (6). Today, you (above) and someone else (below), when it is announced what will happen. In between, someone else's psychology is copied onto you, and yours onto them. Tomorrow, you are tortured (a lightning bolt) and the someone else is given 100,000 dollars (a dollar sign)." xmlns:c2pa="http://c2pa.org/manifest">
