<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 205" width="600" height="205" role="img" aria-label="A timeline. At t1 a stick figure labelled Kim; at t2 a stick figure thinking: Wow! It worked!" xmlns:c2pa="http://c2pa.org/manifest">
  <g fill="none" stroke="#241f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- timeline -->
    <line x1="40" y1="150" x2="560" y2="150"/>
    <line x1="120" y1="140" x2="120" y2="160"/>
    <line x1="420" y1="140" x2="420" y2="160"/>
    <!-- Kim at t1 -->
    <circle cx="120" cy="66" r="10"/>
    <path d="M120 76 V106 M105 88 H135 M120 106 L108 126 M120 106 L132 126"/>
    <!-- person at t2 -->
    <circle cx="420" cy="66" r="10"/>
    <path d="M420 76 V106 M403 84 L420 92 L437 84 M420 106 L408 126 M420 106 L432 126"/>
    <!-- thought bubble -->
    <circle cx="436" cy="54" r="2.5"/>
    <circle cx="447" cy="47" r="4"/>
    <ellipse cx="528" cy="38" rx="68" ry="28"/>
  </g>
  <g fill="#241f1c" font-family="Georgia, 'Iowan Old Style', serif">
    <text x="142" y="124" font-size="17">Kim</text>
    <text x="528" y="36" font-size="15" text-anchor="middle">Wow! It worked!</text>
    <text x="528" y="54" font-size="15" text-anchor="middle">…</text>
    <text x="120" y="186" font-size="19" font-style="italic" text-anchor="middle">t<tspan font-size="13" dy="4">1</tspan></text>
    <text x="420" y="186" font-size="19" font-style="italic" text-anchor="middle">t<tspan font-size="13" dy="4">2</tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
